<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Alice Studio</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header><div class="logo"><a href="index.html">Alice Studio</a></div></header>
  <section class="hero">
    <h1>Commission a set</h1>
    <form action="https://formspree.io/f/demo" method="POST">
      <p><input name="name" placeholder="Your name" required></p>
      <p><input name="email" type="email" placeholder="Email" required></p>
      <p><textarea name="message" placeholder="What would you like made?"></textarea></p>
      <button class="btn">Send</button>
    </form>
  </section>
</body>
</html>
